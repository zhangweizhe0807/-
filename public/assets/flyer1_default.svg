<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2925"/>
      <stop offset="100%" stop-color="#141c19"/>
    </linearGradient>
    <filter id="chalkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Blackboard background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Wooden blackboard frame -->
  <rect x="15" y="15" width="770" height="470" rx="8" fill="none" stroke="#78350f" stroke-width="12"/>
  <rect x="23" y="23" width="754" height="454" rx="4" fill="none" stroke="#ca8a04" stroke-width="2" opacity="0.6"/>

  <!-- Top Yellow Tape Banner -->
  <g transform="translate(100, 35)">
    <rect x="-10" y="0" width="620" height="74" rx="6" fill="#f59e0b" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.4))"/>
    <!-- Tape highlights -->
    <path d="M-10 0 L-20 15 L-10 30 L-20 45 L-10 60 L-20 74 L-10 74 Z" fill="#d97706"/>
    <path d="M610 0 L620 15 L610 30 L620 45 L610 60 L620 74 L610 74 Z" fill="#d97706"/>
    
    <text x="300" y="28" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle" letter-spacing="1">
      5/27（三）10:00 - 17:00 MyNTU 線上投票！
    </text>
    <text x="300" y="58" font-family="'Noto Serif TC', serif" font-size="24" font-weight="900" fill="#1c1917" text-anchor="middle">
      城鄉所學會 第40屆正副會長選舉啦！
    </text>
  </g>

  <!-- Blackboard Chalk content -->
  <g filter="url(#chalkGlow)" opacity="0.95">
    <!-- Four Seasons Blackboard Plan -->
    <rect x="70" y="140" width="660" height="150" rx="8" fill="#182320" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
    
    <text x="400" y="175" font-family="'Noto Sans TC', sans-serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">
      —— 四季相聚承諾 ・ 黑板活動藍圖 ——
    </text>
    
    <!-- Season 1 -->
    <g transform="translate(120, 200)">
      <circle cx="28" cy="28" r="26" fill="none" stroke="#86efac" stroke-width="2"/>
      <text x="28" y="36" font-family="'Noto Serif TC', serif" font-size="20" font-weight="bold" fill="#86efac" text-anchor="middle">春</text>
      <text x="70" y="24" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">春季酒</text>
      <text x="70" y="44" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">破冰微醺開學相聚</text>
    </g>

    <!-- Season 2 -->
    <g transform="translate(260, 200)">
      <circle cx="28" cy="28" r="26" fill="none" stroke="#fde047" stroke-width="2"/>
      <text x="28" y="36" font-family="'Noto Serif TC', serif" font-size="20" font-weight="bold" fill="#fde047" text-anchor="middle">夏</text>
      <text x="70" y="24" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">夏◯酒</text>
      <text x="70" y="44" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">公館樓畢業典禮聚</text>
    </g>

    <!-- Season 3 -->
    <g transform="translate(410, 200)">
      <circle cx="28" cy="28" r="26" fill="none" stroke="#fdba74" stroke-width="2"/>
      <text x="28" y="36" font-family="'Noto Serif TC', serif" font-size="20" font-weight="bold" fill="#fdba74" text-anchor="middle">秋</text>
      <text x="70" y="24" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">秋◯新</text>
      <text x="70" y="44" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">迎新陪伴求生包</text>
    </g>

    <!-- Season 4 -->
    <g transform="translate(560, 200)">
      <circle cx="28" cy="28" r="26" fill="none" stroke="#93c5fd" stroke-width="2"/>
      <text x="28" y="36" font-family="'Noto Serif TC', serif" font-size="20" font-weight="bold" fill="#93c5fd" text-anchor="middle">冬</text>
      <text x="70" y="24" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">冬◯迎</text>
      <text x="70" y="44" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">歲末跨屆溫暖送暖</text>
    </g>
  </g>

  <!-- Candidate Illustration silhouettes & Props -->
  <g transform="translate(100, 310)">
    <!-- Candidate 1: Li Jie -->
    <g transform="translate(80, 0)">
      <rect x="0" y="20" width="180" height="130" rx="12" fill="#1e3a34" stroke="#34d399" stroke-width="1.5"/>
      <text x="90" y="52" font-family="'Noto Serif TC', serif" font-size="18" font-weight="bold" fill="#fef3c7" text-anchor="middle">副會長候選人 李誡</text>
      <text x="90" y="76" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#a7f3d0" text-anchor="middle">手持隨行保溫杯 ☕</text>
      <text x="90" y="105" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">「城鄉所是個學習的地方」</text>
      <text x="90" y="125" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">搭建執行管道 ✕ 組織同學</text>
    </g>

    <!-- Center multiplication symbol -->
    <text x="300" y="90" font-family="'Noto Sans TC', sans-serif" font-size="28" font-weight="bold" fill="#f59e0b" text-anchor="middle">×</text>

    <!-- Candidate 2: Ma Xiaoqi -->
    <g transform="translate(340, 0)">
      <rect x="0" y="20" width="180" height="130" rx="12" fill="#362228" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="90" y="52" font-family="'Noto Serif TC', serif" font-size="18" font-weight="bold" fill="#fef3c7" text-anchor="middle">會長候選人 麻筱祺</text>
      <text x="90" y="76" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#fecdd3" text-anchor="middle">手持 DrinkStore 手搖杯 🧋</text>
      <text x="90" y="105" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">「用擅長的方式參與其中」</text>
      <text x="90" y="125" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">支持社群發展 ✕ 關懷傳承</text>
    </g>
  </g>

  <!-- Bottom CTA badge -->
  <rect x="250" y="450" width="300" height="24" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="400" y="466" font-family="'Noto Sans TC', sans-serif" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle">
    點擊卡片右上角「更換照片」可即時替換為您的實體文宣照片
  </text>
</svg>
